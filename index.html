<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proton Sales Dashboard V2</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="header">
    <h1>🚗 Proton Dashboard V2</h1>
    <button type="button" onclick="toggleTheme()">Dark Mode</button>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h3>Pelanggan</h3>
        <div class="form-group">
          <label for="custName">Nama</label>
          <input id="custName">
        </div>
        <div class="form-group">
          <label for="custPhone">Telefon</label>
          <input id="custPhone">
        </div>
        <button type="button" onclick="saveCustomer()">Simpan Pelanggan</button>
      </div>

      <div class="card">
        <h3>Pembiayaan</h3>
        <div class="form-group">
          <label for="model">Model</label>
          <select id="model"></select>
        </div>
        <div class="form-group">
          <label for="colour">Warna</label>
          <select id="colour"></select>
        </div>
        <div class="form-group">
          <label for="depositPct">Deposit (%)</label>
          <input type="range" min="0" max="30" value="10" id="depositPct">
          <span id="depositLabel">10%</span>
        </div>
        <div class="form-group">
          <label for="tradein">Trade-In (RM)</label>
          <input type="number" value="0" id="tradein">
        </div>
        <div class="form-group">
          <label for="rebate">Rebat (RM)</label>
          <input type="number" value="0" id="rebate">
        </div>
        <div class="form-group">
          <label for="bank">Bank</label>
          <select id="bank">
            <option value="2.75">BSN</option>
            <option value="2.8">Maybank</option>
            <option value="2.85">CIMB</option>
            <option value="2.9">RHB</option>
            <option value="2.95">Bank Islam</option>
          </select>
        </div>
        <div class="form-group">
          <label for="years">Tempoh (Tahun)</label>
          <select id="years">
            <option>5</option>
            <option>7</option>
            <option selected>9</option>
          </select>
        </div>
        <button type="button" onclick="calculate()">Kira Pembiayaan</button>
      </div>
    </div>

    <div>
      <div class="kpi">
        <div class="kpi-card">
          <div class="kpi-title">Harga OTR (tanpa insurans)</div>
          <div class="kpi-value" id="otrWithoutInsurance">RM0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Anggaran Insurans</div>
          <div class="kpi-value" id="estimatedInsurance">RM0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Harga OTR (termasuk insurans)</div>
          <div class="kpi-value" id="otr">RM0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Deposit</div>
          <div class="kpi-value" id="dep">RM0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Pinjaman</div>
          <div class="kpi-value" id="loan">RM0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Ansuran</div>
          <div class="kpi-value" id="monthly">RM0</div>
        </div>
      </div>

      <div class="card">
        <canvas id="chart"></canvas>
      </div>

      <div class="card quote" id="quotation">
        <h3>Quotation</h3>
        <p id="quoteText">Tiada data</p>
        <button type="button" onclick="window.print()">Cetak</button>
      </div>
    </div>
  </div>
</body>
</html>
